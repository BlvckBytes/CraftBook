        - minecraft:red_nether_brick_slab
        - minecraft:red_sandstone_slab
        - minecraft:sandstone_slab
        - minecraft:smooth_quartz_slab
        - minecraft:smooth_red_sandstone_slab
        - minecraft:smooth_sandstone_slab
        - minecraft:smooth_stone_slab
        - minecraft:spruce_planks
        - minecraft:spruce_slab
        - minecraft:stone_brick_slab
        - minecraft:stone_slab
    Elevator:
        allow-redstone: false
        redstone-player-search-radius: 3
        enable-buttons: true
        allow-looping: false
        smooth-movement: false
        smooth-movement-speed: 0.5
    Footprints:
        blocks:
        - minecraft:dirt
        - minecraft:sand
        - minecraft:snow
        - minecraft:snow_block
        - minecraft:ice
        - minecraft:red_sand
    Gate:
        allow-redstone: true
        limit-columns: true
        max-columns: 14
        blocks:
        - minecraft:acacia_fence
        - minecraft:birch_fence
        - minecraft:jungle_fence
        - minecraft:oak_fence
        - minecraft:spruce_fence
        - minecraft:dark_oak_fence
        - minecraft:nether_brick_fence
        - minecraft:iron_bars
        - minecraft:glass_pane
        enforce-type: true
        max-column-height: 12
        gate-search-radius: 3
    HeadDrops:
        drop-mob-heads: true
        drop-player-heads: true
        require-player-killed: true
        drop-head-when-mined: true
        override-natural-head-drops: false
        drop-rate: 0.05
        looting-rate-modifier: 0.05
        show-name-right-click: true
        drop-rates: {}
        custom-mob-skins: {}
        ignored-names:
        - cscorelib
    HiddenSwitch:
        any-side: true
    ICs:
        cache: true
        max-radius: 10.0
        allow-short-hand: true
        keep-loaded: false
        disallowed-ics: []
        default-coordinate-system: RELATIVE
        save-persistent-data: true
        midi-use-percussion: false
        break-on-error: false
        disable-self-triggered: false
    LegacyCauldron:
        block: minecraft:stone
    MinecartBooster:
        max-boost-block: minecraft:gold_block
        25x-boost-block: minecraft:gold_ore
        50x-slow-block: minecraft:soul_sand
        20x-slow-block: minecraft:gravel
    MinecartConstantSpeed:
        speed: 0.5
        ignore-powered-rail: false
    MinecartDecay:
        time-in-ticks: 20
    MinecartDeposit:
        block: minecraft:iron_ore
    MinecartDispenser:
        block: minecraft:emerald_ore
        spawn-infront: false
        check-for-carts: true
        propel-cart: false
    MinecartEjector:
        block: minecraft:iron_block
    MinecartElevator:
        block: minecraft:nether_bricks
    MinecartExitRemover:
        give-item: false
    MinecartFallModifier:
        vertical-fall-speed: 0.9
        horizontal-fall-speed: 1.1
    MinecartMaxSpeed:
        block: minecraft:coal_block
    MinecartMessenger:
        block: minecraft:end_stone
    MinecartMoreRails:
        pressure-plate-intersection: false
        ladder-vertical-rail: false
        ladder-vertical-rail-velocity: 0.5
    MinecartNoCollide:
        empty-carts: true
        full-carts: false
    MinecartRemoveEntities:
        remove-other-minecarts: false
        allow-empty-carts: false
        damage-players: true
    MinecartReverser:
        block: minecraft:white_wool
    MinecartSorter:
        block: minecraft:netherrack
    MinecartSpeedModifiers:
        max-speed: 1.0
        off-rail-speed: 0.0
    MinecartStation:
        block: minecraft:obsidian
    MinecartTeleporter:
        block: minecraft:emerald_block
    MinecartVisionSteering:
        minimum-sensitivity: 3
    Pipes:
        allow-diagonal: false
        insulator-block: minecraft:white_wool
        stack-per-move: true
        require-sign: false
        max-tube-block-count: -1
        max-piston-block-count: -1
        max-cache-load-count: 500
        initial-chunk-retain-duration: 20
        continued-chunk-retain-duration: 20
        notification-radius: 5
    SignCopier:
        item: minecraft:ink_sac
    Sponge:
        radius: 5
        circular-radius: true
        require-redstone: false
        include-wet: false
    Teleporter:
        require-sign: false
        max-range: 0
    ToggleArea:
        allow-redstone: true
        use-schematics: true
        shorten-long-names: true
        max-size: 5000
        max-per-user: 30
    Variables:
        default-to-global: false
        enable-in-console: false
        enable-in-player-commands: false
        enable-in-player-chat: false
        override-all-text: false
    XPStorer:
        require-bottle: false
        xp-per-bottle: 16
        block: minecraft:spawner
        require-sneaking-state: 'no'
        radius-mode: false
        radius: 5
