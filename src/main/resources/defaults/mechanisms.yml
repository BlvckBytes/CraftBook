mechanics:
    Elevator:
        allow-redstone: false
        redstone-player-search-radius: 3
        enable-buttons: true
        allow-looping: false
        smooth-movement: false
        smooth-movement-speed: 0.5
    ICs:
        max-radius: 10.0
        default-coordinate-system: RELATIVE
    Pipes:
        allow-diagonal: false
        insulator-block: minecraft:white_wool
        stack-per-move: true
        require-sign: false
        max-tube-block-count: -1
        max-piston-block-count: -1
        max-cache-load-count: 500
        initial-chunk-retain-duration: 20
        continued-chunk-retain-duration: 20
        notification-radius: 5
    Teleporter:
        require-sign: false
        max-range: 0
