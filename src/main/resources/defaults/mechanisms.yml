mechanics:
    Elevator:
        allow-redstone: false
        redstone-player-search-radius: 3
        enable-buttons: true
        allow-looping: false
        smooth-movement: false
        smooth-movement-speed: 0.5
    ICs:
        max-radius: 10.0
    Pipes:
        stack-per-move: true
        require-sign: false
        drop-exceeded-limits: true
        drop-no-sign: true
        max-tube-block-count: -1
        max-piston-block-count: -1
        max-cache-load-count: 500
        notification-radius: 5
        notify-owners-of-region: true
        notify-members-of-region: false
        notify-ignored-regions: []
        notification-debounce-delay: 15
    Teleporter:
        require-sign: false
        max-range: 0
