        spoons: true
        enable-redstone: false
        item-tracking: false
        require-sign: false
    CustomDrops:
        require-permissions: false
        remove-vanilla-drops: false
    DispenserRecipes:
        cannon-enable: true
        fan-enable: true
        fire-arrows-enable: true
        snow-shooter-enable: true
        xp-shooter-enable: true
    Door:
        enforce-type: true
        allow-redstone: true
        max-length: 30
        max-width: 5
